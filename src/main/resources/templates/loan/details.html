<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Loan Details</title>
</head>
<body>

<h2>Loan Details</h2>

<p><strong>ID:</strong> <span th:text="${loan.id}">Loan1</span></p>
<p><strong>Member:</strong> <span th:text="${loan.member != null ? loan.member.name : 'N/A'}">Member Name</span></p>
<p><strong>Loan Date:</strong> <span th:text="${loan.loanDate}">2024-01-01</span></p>
<p><strong>Due Date:</strong> <span th:text="${loan.dueDate}">2024-02-01</span></p>
<p><strong>Status:</strong> <span th:text="${loan.status}">OPEN</span></p>

<h3>Items in this loan:</h3>
<ul>
    <li th:each="item : ${loan.items}"
        th:text="${item.id + ' - ' + item.barcode}">
        Item info
    </li>
</ul>
<p th:if="${#lists.isEmpty(loan.items)}">No items.</p>

<h3>Reservations for this loan:</h3>
<ul>
    <li th:each="res : ${loan.reservations}"
        th:text="${res.id + ' - ' + res.date}">
        Reservation info
    </li>
</ul>
<p th:if="${#lists.isEmpty(loan.reservations)}">No reservations.</p>

<a th:href="@{/loans}">Back</a>

</body>
</html>
