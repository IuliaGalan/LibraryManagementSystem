<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Loan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .required {
            color: #f44336;
            margin-left: 3px;
        }

        input[type="text"],
        input[type="date"],
        select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 15px;
            transition: all 0.3s;
            background-color: #fafafa;
        }

        input[type="text"]:focus,
        input[type="date"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            background-color: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input[readonly] {
            background-color: #f0f0f0;
            color: #666;
            cursor: not-allowed;
        }

        select {
            cursor: pointer;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            text-align: center;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background-color: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background-color: #d0d0d0;
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .container {
                padding: 25px;
            }

            .button-group {
                flex-direction: column;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>➕ Add New Loan</h1>
    <p class="subtitle">Fill in the details to create a new loan</p>

    <form th:action="@{/loans}" method="post" th:object="${loan}">

        <!-- ID (readonly) -->
        <div class="form-group">
            <label for="id">Loan ID</label>
            <input type="text"
                   id="id"
                   th:field="*{id}"
                   readonly/>
            <small style="color: #666; font-size: 12px; display: block; margin-top: 5px;">
                Auto-generated ID
            </small>
        </div>

        <!-- Member (required) -->
        <div class="form-group">
            <label for="memberId">
                Member <span class="required">*</span>
            </label>
            <select id="memberId" name="memberId" required>
                <option value="">-- Select a member --</option>
                <option th:each="m : ${members}"
                        th:value="${m.id}"
                        th:text="${m.name}">
                </option>
            </select>
        </div>

        <!-- Loan Date (required) -->
        <div class="form-group">
            <label for="loanDate">
                Loan Date <span class="required">*</span>
            </label>
            <input type="date"
                   id="loanDate"
                   th:field="*{loanDate}"
                   required/>
        </div>

        <!-- Due Date (required) -->
        <div class="form-group">
            <label for="dueDate">
                Due Date <span class="required">*</span>
            </label>
            <input type="date"
                   id="dueDate"
                   th:field="*{dueDate}"
                   required/>
        </div>

        <!-- Status (required) -->
        <div class="form-group">
            <label for="status">
                Status <span class="required">*</span>
            </label>
            <select id="status" th:field="*{status}" required>
                <option th:each="s : ${statuses}"
                        th:value="${s}"
                        th:text="${s}">
                </option>
            </select>
        </div>

        <!-- Buttons -->
        <div class="button-group">
            <button type="submit" class="btn btn-primary">💾 Save Loan</button>
            <a th:href="@{/loans}" class="btn btn-secondary">✖ Cancel</a>
        </div>

    </form>
</div>

</body>
</html>
