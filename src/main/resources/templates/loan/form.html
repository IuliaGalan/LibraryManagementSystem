<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add New Loan</title>
</head>
<body>
<h1>Add New Loan</h1>

<form th:action="@{/loan}" method="post" th:object="${loan}">
    <div>
        <label for="id">ID (optional):</label>
        <input type="text" id="id" th:field="*{id}" />
    </div>

    <div>
        <label for="memberId">Member ID:</label>
        <input type="text" id="memberId" th:field="*{memberId}" required />
    </div>

    <div>
        <label for="date">Date:</label>
        <input type="date" id="date" th:field="*{date}" required />
    </div>

    <div>
        <label for="dueDate">Due Date:</label>
        <input type="date" id="dueDate" th:field="*{dueDate}" required />
    </div>

    <div>
        <label for="status">Status:</label>
        <input type="text" id="status" th:field="*{status}" required />
    </div>

    <div>
        <button type="submit">Save</button>
    </div>
</form>

<p><a th:href="@{/loan}">Back to list</a></p>
</body>
</html>
