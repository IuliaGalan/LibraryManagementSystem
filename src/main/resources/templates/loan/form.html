<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add New Loan</title>
</head>
<body>

<h1>Add New Loan</h1>

<form th:action="@{/loans}" method="post" th:object="${loan}">

    <label>ID:</label>
    <input type="text" th:field="*{id}" readonly/><br>

    <!-- ✅ DROPDOWN PENTRU MEMBER -->
    <label>Member:</label>
    <select name="memberId" required>
        <option value="">-- Select a member --</option>
        <option th:each="m : ${members}"
                th:value="${m.id}"
                th:text="${m.name}">
        </option>
    </select><br>

    <label>Loan Date:</label>
    <input type="date" th:field="*{loanDate}" required/><br>

    <label>Due Date:</label>
    <input type="date" th:field="*{dueDate}" required/><br>

    <label>Status:</label>
    <select th:field="*{status}">
        <option th:each="s : ${statuses}"
                th:value="${s}"
                th:text="${s}">
        </option>
    </select><br>

    <button type="submit">Save</button>
</form>

<p><a th:href="@{/loans}">Back to list</a></p>

</body>
</html>
