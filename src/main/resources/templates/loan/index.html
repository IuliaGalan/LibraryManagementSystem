<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Loan List</title>
</head>
<body>
<h1>Loans</h1>

<p><a th:href="@{/loan/new}">Add new loan</a></p>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Member ID</th>
        <th>Date</th>
        <th>Due Date</th>
        <th>Status</th>
        <th>Actions</th>
    </tr>
    <tr th:each="ln : ${loans}">
        <td th:text="${ln.id}"></td>
        <td th:text="${ln.memberId}"></td>
        <td th:text="${ln.date}"></td>
        <td th:text="${ln.dueDate}"></td>
        <td th:text="${ln.status}"></td>
        <td>
            <form th:action="@{'/loan/' + ${ln.id} + '/delete'}" method="post">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
</table>

</body>
</html>
