<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Loans</title>
</head>
<body>

<h1>Loans</h1>

<a th:href="@{/loans/new}">Add new loan</a>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Loan date</th>
        <th>Due date</th>
        <th>Status</th>
        <th>Member ID</th>
        <th>Member name</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="loan : ${loans}">
        <td th:text="${loan.id}">Loan1</td>
        <td th:text="${loan.date}">2025-11-01</td>
        <td th:text="${loan.dueDate}">2025-11-15</td>
        <td th:text="${loan.status}">OPEN</td>

        <!-- aici era eroarea: înainte probabil aveai ${loan.memberId} -->
        <td th:text="${loan.member.id}">M1</td>
        <td th:text="${loan.member.name}">John Doe</td>
    </tr>
    </tbody>
</table>

</body>
</html>
