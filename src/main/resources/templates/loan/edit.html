<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Loan</title>
</head>
<body>

<h2>Edit Loan</h2>

<form th:action="@{/loans/{id}(id=${loan.id})}"
      th:object="${loan}"
      method="post">

    <label>ID:
        <input th:field="*{id}" readonly/>
    </label><br/>

    <label>Loan Date:
        <input type="date" th:field="*{loanDate}" required/>
    </label><br/>

    <label>Due Date:
        <input type="date" th:field="*{dueDate}" required/>
    </label><br/>

    <label>Status:
        <select th:field="*{status}">
            <option th:each="s : ${statuses}"
                    th:value="${s}"
                    th:text="${s}">
            </option>
        </select>
    </label><br/>

    <button type="submit">Update</button>
</form>

<a th:href="@{/loans}">Back</a>

</body>
</html>
