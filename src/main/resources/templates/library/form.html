<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Library</title>
</head>
<body>

<h2>Add Library</h2>

<form th:action="@{/libraries}" th:object="${library}" method="post">

    <label>ID:
        <input th:field="*{id}" readonly/>
    </label>
    <br/>

    <label>Name:
        <input th:field="*{name}"/>
    </label>
    <div th:if="${#fields.hasErrors('name')}"
         th:errors="*{name}"></div>
    <br/>

    <label>Address:
        <input th:field="*{address}"/>
    </label>
    <br/>

    <label>Phone:
        <input th:field="*{phoneNumber}"/>
    </label>
    <br/>

    <label>Email:
        <input type="email" th:field="*{email}"/>
    </label>
    <div th:if="${#fields.hasErrors('email')}"
         th:errors="*{email}"></div>
    <br/>

    <button type="submit">Save</button>
</form>

<a th:href="@{/libraries}">Back</a>

</body>
</html>
