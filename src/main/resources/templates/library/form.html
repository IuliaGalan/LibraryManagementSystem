<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Library</title>
</head>
<body>
<h1>Add New Library</h1>

<form th:action="@{/library}" method="post" th:object="${library}">
    <label>ID (optional):</label>
    <input type="text" th:field="*{id}" /><br>

    <label>Name:</label>
    <input type="text" th:field="*{name}" required /><br>

    <label>Address:</label>
    <input type="text" th:field="*{address}" /><br>

    <label>Phone:</label>
    <input type="text" th:field="*{phoneNumber}" /><br>

    <label>Email:</label>
    <input type="email" th:field="*{email}" /><br>

    <button type="submit">Save</button>
</form>

<p><a th:href="@{/library}">Back to list</a></p>
</body>
</html>
