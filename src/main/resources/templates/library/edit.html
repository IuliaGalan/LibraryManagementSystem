<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Library</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .form-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
            overflow: hidden;
        }

        .form-header {
            background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .form-header h1 {
            font-size: 2em;
            margin-bottom: 5px;
        }

        .form-content {
            padding: 40px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .required {
            color: #f44336;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #2196F3;
            box-shadow: 0 0 0 3px rgba(33, 150, 243, 0.1);
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .error-message {
            color: #f44336;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }

        .form-group.error input {
            border-color: #f44336;
        }

        .form-group.error .error-message {
            display: block;
        }

        .form-actions {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(33, 150, 243, 0.4);
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #666;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .help-text {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            .form-content {
                padding: 25px;
            }

            .form-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
<div class="form-container">
    <div class="form-header">
        <h1>✏️ Edit Library</h1>
        <p>Update library details</p>
    </div>

    <div class="form-content">
        <form th:action="@{/libraries/{id}/update(id=${library.id})}" method="post" th:object="${library}" id="libraryForm">

            <!-- Hidden ID field -->
            <input type="hidden" th:field="*{id}">

            <!-- NAME -->
            <div class="form-group">
                <label for="name">Library Name <span class="required">*</span></label>
                <input type="text"
                       id="name"
                       th:field="*{name}"
                       required
                       placeholder="Enter library name"
                       maxlength="100">
                <div class="error-message" id="nameError">Please enter a library name</div>
            </div>

            <!-- ADDRESS -->
            <div class="form-group">
                <label for="address">Address <span class="required">*</span></label>
                <textarea id="address"
                          th:field="*{address}"
                          required
                          placeholder="Enter library address"
                          maxlength="255"></textarea>
                <div class="error-message" id="addressError">Please enter an address</div>
            </div>

            <!-- PHONE NUMBER -->
            <div class="form-group">
                <label for="phoneNumber">Phone Number <span class="required">*</span></label>
                <input type="tel"
                       id="phoneNumber"
                       th:field="*{phoneNumber}"
                       required
                       placeholder="e.g., 0264-590110 or +40264590110"
                       pattern="^(\+?\d{1,3}[-.\s]?)?\(?\d{3,4}\)?[-.\s]?\d{3,4}[-.\s]?\d{3,4}$"
                       maxlength="20">
                <div class="help-text">Format: 0264-590110, +40264590110, sau (0264) 590110</div>
                <div class="error-message" id="phoneError">Please enter a valid phone number</div>
            </div>

            <!-- EMAIL -->
            <div class="form-group">
                <label for="email">Email <span class="required">*</span></label>
                <input type="email"
                       id="email"
                       th:field="*{email}"
                       required
                       placeholder="library@example.com"
                       maxlength="100">
                <div class="error-message" id="emailError">Please enter a valid email address</div>
            </div>

            <!-- ACTIONS -->
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">💾 Update Library</button>
                <a href="/libraries" class="btn btn-secondary">❌ Cancel</a>
            </div>
        </form>
    </div>
</div>

<script>
    // Client-side validation
    const form = document.getElementById('libraryForm');
    const phoneInput = document.getElementById('phoneNumber');
    const phoneError = document.getElementById('phoneError');

    // Phone number validation patterns
    const phonePatterns = [
        /^(\+?\d{1,3}[-.\s]?)?\(?\d{3,4}\)?[-.\s]?\d{3,4}[-.\s]?\d{3,4}$/,  // General international
        /^0\d{3}[-.\s]?\d{3}[-.\s]?\d{3,4}$/,  // Romanian format: 0264-590-110
        /^\+40\d{9}$/,  // Romanian international: +40264590110
    ];

    phoneInput.addEventListener('input', function() {
        const value = this.value.trim();
        const isValid = phonePatterns.some(pattern => pattern.test(value));

        const formGroup = this.parentElement;
        if (!isValid && value.length > 0) {
            formGroup.classList.add('error');
        } else {
            formGroup.classList.remove('error');
        }
    });

    form.addEventListener('submit', function(e) {
        let isValid = true;

        // Validate all required fields
        const requiredFields = form.querySelectorAll('[required]');
        requiredFields.forEach(field => {
            const formGroup = field.parentElement;
            if (!field.value.trim()) {
                formGroup.classList.add('error');
                isValid = false;
            } else {
                formGroup.classList.remove('error');
            }
        });

        // Validate phone number specifically
        const phoneValue = phoneInput.value.trim();
        const phoneValid = phonePatterns.some(pattern => pattern.test(phoneValue));

        if (!phoneValid) {
            phoneInput.parentElement.classList.add('error');
            isValid = false;
        }

        if (!isValid) {
            e.preventDefault();
            alert('Please correct the errors in the form before submitting.');
        }
    });
</script>
</body>
</html>
