<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Library</title>
    <style>
        .error { color: red; font-size: 0.9em; }
    </style>
</head>
<body>

<h2>Edit Library</h2>

<form th:action="@{/libraries/{id}(id=${library.id})}"
      th:object="${library}"
      method="post">

    <div th:if="${#fields.hasGlobalErrors()}">
        <p class="error" th:each="err : ${#fields.globalErrors()}"
           th:text="${err}"></p>
    </div>

    <p>
        <label>ID:
            <input th:field="*{id}" readonly/>
        </label>
    </p>

    <p>
        <label>Name:
            <input th:field="*{name}"/>
        </label>
        <span class="error" th:if="${#fields.hasErrors('name')}"
              th:errors="*{name}"></span>
    </p>

    <p>
        <label>Address:
            <input th:field="*{address}"/>
        </label>
    </p>

    <p>
        <label>Phone:
            <input th:field="*{phoneNumber}"/>
        </label>
    </p>

    <p>
        <label>Email:
            <input type="email" th:field="*{email}"/>
        </label>
        <span class="error" th:if="${#fields.hasErrors('email')}"
              th:errors="*{email}"></span>
    </p>

    <button type="submit">Update</button>
</form>

<p><a th:href="@{/libraries}">Back</a></p>

</body>
</html>
