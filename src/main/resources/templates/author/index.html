<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Authors</title>
</head>
<body>
<h2>Authors</h2>

<a th:href="@{/authors/new}">Add new</a>

<table border="1" cellpadding="6">
    <tr><th>ID</th><th>Name</th><th>Nationality</th><th>Actions</th></tr>

    <tr th:each="a : ${authors}">
        <td th:text="${a.id}">A1</td>
        <td th:text="${a.name}">Name</td>
        <td th:text="${a.nationality}">RO</td>
        <td>
            <form th:action="@{'/authors/' + ${a.id} + '/delete'}" method="post">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
</table>

</body>
</html>
