<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Author</title>
</head>
<body>

<h2>Edit Author</h2>

<form th:action="@{/authors/{id}(id=${author.id})}"
      th:object="${author}"
      method="post">

    <!-- ID nu se schimbă -->
    <p>
        <label>ID:
            <input th:field="*{id}" readonly/>
        </label>
    </p>

    <!-- Name cu validare (@NotBlank) -->
    <p>
        <label>Name:
            <input th:field="*{name}"/>
        </label>
        <span th:if="${#fields.hasErrors('name')}"
              th:errors="*{name}"></span>
    </p>

    <!-- Nationality este opțională -->
    <p>
        <label>Nationality:
            <input th:field="*{nationality}"/>
        </label>
        <span th:if="${#fields.hasErrors('nationality')}"
              th:errors="*{nationality}"></span>
    </p>

    <button type="submit">Update</button>
</form>

<p><a th:href="@{/authors}">Back</a></p>

</body>
</html>
