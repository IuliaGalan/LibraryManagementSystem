<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Author Details</title>
</head>
<body>

<h2>Author Details</h2>

<p><strong>ID:</strong> <span th:text="${author.id}">A1</span></p>
<p><strong>Name:</strong> <span th:text="${author.name}">Author Name</span></p>
<p><strong>Nationality:</strong> <span th:text="${author.nationality}">Country</span></p>

<h3>Books by this author:</h3>
<ul>
    <li th:each="b : ${books}"
        th:text="${b.title}">
        Book title
    </li>
</ul>

<h3>Magazine:</h3>
<div th:if="${magazine != null}">
    <p><strong>Title:</strong> <span th:text="${magazine.title}">Title</span></p>
    <p><strong>Publisher:</strong> <span th:text="${magazine.publisher}">Publisher</span></p>
    <p><strong>Language:</strong> <span th:text="${magazine.language}">EN</span></p>
</div>
<p th:if="${magazine == null}">No magazine assigned.</p>

<p><a th:href="@{/authors}">Back</a></p>

</body>
</html>
