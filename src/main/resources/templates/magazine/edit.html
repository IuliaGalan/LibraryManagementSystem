<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Magazine</title>
</head>
<body>

<h2>Edit Magazine</h2>

<form th:action="@{/magazines/{id}(id=${magazine.id})}"
      th:object="${magazine}"
      method="post">

    <p>
        <label>ID:
            <input th:field="*{id}" readonly/>
        </label>
    </p>

    <p>
        <label>Title:
            <input th:field="*{title}"/>
        </label>
        <span th:if="${#fields.hasErrors('title')}"
              th:errors="*{title}"></span>
    </p>

    <p>
        <label>Publisher:
            <input th:field="*{publisher}"/>
        </label>
        <span th:if="${#fields.hasErrors('publisher')}"
              th:errors="*{publisher}"></span>
    </p>

    <p>
        <label>Language:
            <input th:field="*{language}"/>
        </label>
        <span th:if="${#fields.hasErrors('language')}"
              th:errors="*{language}"></span>
    </p>

    <button type="submit">Update</button>
</form>

<p><a th:href="@{/magazines}">Back to list</a></p>

</body>
</html>
