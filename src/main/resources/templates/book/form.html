<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Book</title>
</head>
<body>
<h2>Add new book</h2>

<!-- erori globale, dacă există -->
<div th:if="${#fields.hasGlobalErrors()}">
    <p th:each="err : ${#fields.globalErrors()}"
       th:text="${err}"></p>
</div>

<form th:action="@{/books}" th:object="${book}" method="post">

    <!-- ID generat în BookService.newForForm(), doar afișat -->
    <label>ID:
        <input th:field="*{id}" readonly/>
    </label>
    <br/>

    <label>Title:
        <input th:field="*{title}"/>
    </label>
    <div th:if="${#fields.hasErrors('title')}"
         th:errors="*{title}"></div>
    <br/>

    <label>Genre:
        <input th:field="*{genre}"/>
    </label>
    <div th:if="${#fields.hasErrors('genre')}"
         th:errors="*{genre}"></div>
    <br/>

    <!-- alte câmpuri din BookDetails dacă ai nevoie -->

    <button type="submit">Save</button>
</form>

<a th:href="@{/books}">Back to list</a>

</body>
</html>
