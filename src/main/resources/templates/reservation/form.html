<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Add Reservation</title></head>
<body>
<h1>Add New Reservation</h1>

<form th:action="@{/reservation}" method="post" th:object="${reservation}">
    <label>ID:</label>
    <input type="text" th:field="*{id}" /><br>

    <label>Member ID:</label>
    <input type="text" th:field="*{memberId}" required /><br>

    <label>ReadableItem ID:</label>
    <input type="text" th:field="*{readableItemId}" required /><br>

    <label>Date:</label>
    <input type="text" th:field="*{date}" placeholder="YYYY-MM-DD" /><br>

    <label>Status:</label>
    <input type="text" th:field="*{status}" placeholder="PENDING/ACTIVE/etc." /><br>

    <button type="submit">Save</button>
</form>

<p><a th:href="@{/reservation}">Back to list</a></p>
</body>
</html>
