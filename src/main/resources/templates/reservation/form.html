<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Reservation</title>
</head>
<body>

<h1>Add New Reservation</h1>

<form th:action="@{/reservations}" method="post" th:object="${reservation}">

    <label>ID:</label>
    <input type="text" th:field="*{id}" readonly/><br>

    <label>Date:</label>
    <input type="date" th:field="*{date}" required/><br>

    <label>Status:</label>
    <select th:field="*{status}">
        <option th:each="s : ${statuses}"
                th:value="${s}"
                th:text="${s}">
        </option>
    </select><br>

    <button type="submit">Save</button>
</form>

<p><a th:href="@{/reservations}">Back to list</a></p>

</body>
</html>
