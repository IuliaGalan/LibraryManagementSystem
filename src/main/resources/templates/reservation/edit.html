<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Reservation</title>
</head>
<body>

<h2>Edit Reservation</h2>

<form th:action="@{/reservations/{id}(id=${reservation.id})}"
      th:object="${reservation}"
      method="post">

    <label>ID:
        <input th:field="*{id}" readonly/>
    </label><br/>

    <label>Date:
        <input type="date" th:field="*{date}" required/>
    </label><br/>

    <label>Status:
        <select th:field="*{status}">
            <option th:each="s : ${statuses}"
                    th:value="${s}"
                    th:text="${s}">
            </option>
        </select>
    </label><br/>

    <button type="submit">Update</button>
</form>

<a th:href="@{/reservations}">Back</a>

</body>
</html>
