<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reservation Details</title>
</head>
<body>

<h2>Reservation Details</h2>

<p><strong>ID:</strong> <span th:text="${reservation.id}">R1</span></p>
<p><strong>Date:</strong> <span th:text="${reservation.date}">2024-01-01</span></p>
<p><strong>Status:</strong> <span th:text="${reservation.status}">ACTIVE</span></p>
<p><strong>Member:</strong> <span th:text="${reservation.member != null ? reservation.member.name : 'N/A'}">Member Name</span></p>
<p><strong>Readable Item:</strong> <span th:text="${reservation.readableItem != null ? reservation.readableItem.id : 'N/A'}">Item ID</span></p>
<p><strong>Loan:</strong> <span th:text="${reservation.loan != null ? reservation.loan.id : 'N/A'}">Loan ID</span></p>

<a th:href="@{/reservations}">Back</a>

</body>
</html>
