<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reservations</title>
</head>
<body>

<h1>Reservations</h1>
<a th:href="@{/reservations/new}">Add new Reservation</a>
<br/><br/>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Member</th>
        <th>Readable Item</th>
        <th>Date</th>
        <th>Status</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="res : ${reservations}">
        <td th:text="${res.id}">R1</td>
        <td th:text="${res.member != null ? res.member.name : 'N/A'}">Member Name</td>
        <td th:text="${res.readableItem != null ? res.readableItem.id : 'N/A'}">Item ID</td>
        <td th:text="${res.date}">2024-01-01</td>
        <td th:text="${res.status}">ACTIVE</td>

        <td>
            <a th:href="@{/reservations/{id}/details(id=${res.id})}">Details</a>
            &nbsp;|&nbsp;
            <a th:href="@{/reservations/{id}/edit(id=${res.id})}">Edit</a>
            &nbsp;|&nbsp;

            <form th:action="@{/reservations/{id}/delete(id=${res.id})}"
                  method="post"
                  style="display:inline">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
