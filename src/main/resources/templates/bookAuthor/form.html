<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Book–Author Link</title>
</head>
<body>
<h1>Add Book–Author Link</h1>

<form action="/bookauthors" method="post">
    <label for="bookId">Book:</label>
    <select id="bookId" name="bookId" required>
        <option value="" disabled th:selected="${selectedBookId == null}">-- select a book --</option>
        <option th:each="b : ${books}"
                th:value="${b.id}"
                th:text="${b.title}"
                th:selected="${selectedBookId != null} ? ${b.id} == ${selectedBookId} : false">
        </option>
    </select>

    <br><br>

    <label for="authorId">Author:</label>
    <select id="authorId" name="authorId" required>
        <option value="" disabled th:selected="${selectedAuthorId == null}">-- select an author --</option>
        <option th:each="a : ${authors}"
                th:value="${a.id}"
                th:text="${a.name}"
                th:selected="${selectedAuthorId != null} ? ${a.id} == ${selectedAuthorId} : false">
        </option>
    </select>

    <br><br>
    <button type="submit">Save</button>
    <a th:href="@{/bookauthors}">Cancel</a>
</form>

</body>
</html>
