<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Book–Author Links</title>
</head>
<body>

<h1>Book–Author Links</h1>

<p><a th:href="@{/bookauthors/new}">Add new link</a></p>

<table border="1" cellpadding="6">
    <thead>
    <tr>
        <th>ID</th>
        <th>Book Title</th>
        <th>Author Name</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="r : ${rows}">
        <td th:text="${r.id}"></td>
        <td th:text="${r.bookTitle}"></td>
        <td th:text="${r.authorName}"></td>

        <td>
            <a th:href="@{/bookauthors/{id}/details(id=${r.id})}">Details</a>
            &nbsp;|&nbsp;
            <a th:href="@{/bookauthors/{id}/edit(id=${r.id})}">Edit</a>
            &nbsp;|&nbsp;
            <form th:action="@{/bookauthors/{id}/delete(id=${r.id})}"
                  method="post"
                  style="display:inline">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>

</table>

</body>
</html>
