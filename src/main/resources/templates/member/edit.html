<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Loan</title>
</head>
<body>

<h2>Edit Loan</h2>

<form th:action="@{/loan/{id}(id=${loan.id})}" th:object="${loan}" method="post">

    <label>ID:
        <input th:field="*{id}" readonly/>
    </label><br/>

    <label>Member ID:
        <input th:field="*{memberId}"/>
    </label><br/>

    <label>Date:
        <input type="date" th:field="*{date}"/>
    </label><br/>

    <label>Due Date:
        <input type="date" th:field="*{dueDate}"/>
    </label><br/>

    <label>Status:
        <input th:field="*{status}"/>
    </label><br/>

    <button type="submit">Update</button>
</form>

<a th:href="@{/loan}">Back</a>

</body>
</html>
