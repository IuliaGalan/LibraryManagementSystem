<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Member</title>
    <style>
        .error {
            color: red;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

<h2>Edit Member</h2>

<form th:action="@{/members/{id}(id=${member.id})}"
      th:object="${member}"
      method="post">

    <!-- 🔹 ERORI GLOBALE (dacă există) -->
    <div th:if="${#fields.hasGlobalErrors()}">
        <p class="error" th:each="err : ${#fields.globalErrors()}"
           th:text="${err}"></p>
    </div>

    <p>
        <label>ID:
            <input th:field="*{id}" readonly/>
        </label>
    </p>

    <p>
        <label>Name:
            <input th:field="*{name}"/>
        </label>
        <span class="error" th:if="${#fields.hasErrors('name')}"
              th:errors="*{name}"></span>
    </p>

    <p>
        <label>Library ID:
            <input th:field="*{libraryId}"/>
        </label>
    </p>

    <p>
        <label>Address:
            <input th:field="*{address}"/>
        </label>
    </p>

    <p>
        <label>Email:
            <input type="email" th:field="*{email}"/>
        </label>
        <span class="error" th:if="${#fields.hasErrors('email')}"
              th:errors="*{email}"></span>
    </p>

    <button type="submit">Update</button>
</form>

<p><a th:href="@{/members}">Back</a></p>

</body>
</html>
