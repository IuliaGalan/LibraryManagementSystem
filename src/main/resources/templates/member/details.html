<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Member Details</title>
</head>
<body>

<h2>Member Details</h2>

<p><strong>ID:</strong> <span th:text="${member.id}">M1</span></p>
<p><strong>Name:</strong> <span th:text="${member.name}">Member Name</span></p>
<p><strong>Library ID:</strong> <span th:text="${member.libraryId}">L1</span></p>
<p><strong>Address:</strong> <span th:text="${member.address}">Address</span></p>
<p><strong>Email:</strong> <span th:text="${member.email}">Email</span></p>

<h3>Loans:</h3>
<ul>
    <li th:each="loan : ${member.loans}"
        th:text="${loan.id + ' - ' + #dates.format(loan.date, 'yyyy-MM-dd')}">
        Loan info
    </li>
</ul>

<h3>Reservations:</h3>
<ul>
    <li th:each="res : ${member.reservations}"
        th:text="${res.id + ' - ' + res.date}">
        Reservation info
    </li>
</ul>

<a th:href="@{/member}">Back</a>

</body>
</html>
