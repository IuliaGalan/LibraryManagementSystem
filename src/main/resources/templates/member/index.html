<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Members</title>
</head>
<body>

<h1>Members</h1>

<a th:href="@{/members/new}">Add new member</a>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Address</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="member : ${members}">
        <td th:text="${member.id}">M1</td>
        <td th:text="${member.name}">John Doe</td>
        <td th:text="${member.email}">john@example.com</td>
        <td th:text="${member.address}">Str. Exemplu 1</td>
    </tr>
    </tbody>
</table>

</body>
</html>
