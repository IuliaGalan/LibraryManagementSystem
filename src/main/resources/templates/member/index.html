<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Members</title>
</head>
<body>

<h1>Members</h1>
<a th:href="@{/member/new}">Add new Member</a>
<br/><br/>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Library ID</th>
        <th>Email</th>
        <th>Address</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="member : ${members}">
        <td th:text="${member.id}">M1</td>
        <td th:text="${member.name}">John Doe</td>
        <td th:text="${member.libraryId}">L1</td>
        <td th:text="${member.email}">john@example.com</td>
        <td th:text="${member.address}">123 Main St</td>

        <td>
            <a th:href="@{/member/{id}/details(id=${member.id})}">Details</a>
            &nbsp;|&nbsp;
            <a th:href="@{/member/{id}/edit(id=${member.id})}">Edit</a>
            &nbsp;|&nbsp;

            <form th:action="@{/member/{id}/delete(id=${member.id})}"
                  method="post"
                  style="display:inline">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
