<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Add Member</title></head>
<body>
<h1>Add New Member</h1>

<form th:action="@{/member}" method="post" th:object="${member}">
    <!-- Dacă folosești Spring Security, DECOMENTEAZĂ linia de mai jos -->
    <!-- <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/> -->

    <label>ID (optional):</label>
    <input type="text" th:field="*{id}"/><br>

    <label>Name:</label>
    <input type="text" th:field="*{name}" required/><br>

    <label>Library ID:</label>
    <input type="text" th:field="*{libraryId}" required/><br>

    <label>Address:</label>
    <input type="text" th:field="*{address}"/><br>

    <label>Email:</label>
    <input type="email" th:field="*{email}"/><br>

    <button type="submit">Save</button>
</form>

<p><a th:href="@{/member}">Back to list</a></p>
</body>
</html>
