<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Member</title>
    <style>
        .error {
            color: red;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

<h2>Add Member</h2>

<form th:action="@{/members}" th:object="${member}" method="post">

    <!-- 🔹 ERORI GLOBALE (dacă există) -->
    <div th:if="${#fields.hasGlobalErrors()}">
        <p class="error" th:each="err : ${#fields.globalErrors()}"
           th:text="${err}"></p>
    </div>

    <label>ID:
        <input th:field="*{id}" readonly/>
    </label>
    <br/>

    <label>Name:
        <input th:field="*{name}"/>
    </label>
    <!-- 🔹 Eroare pentru name (@NotBlank) -->
    <div class="error" th:if="${#fields.hasErrors('name')}"
         th:errors="*{name}"></div>
    <br/>

    <label>Library ID:
        <input th:field="*{libraryId}"/>
    </label>
    <br/>

    <label>Address:
        <input th:field="*{address}"/>
    </label>
    <br/>

    <label>Email:
        <input type="email" th:field="*{email}"/>
    </label>
    <!-- 🔹 Eroare pentru email (duplicat sau @Email) -->
    <div class="error" th:if="${#fields.hasErrors('email')}"
         th:errors="*{email}"></div>
    <br/>

    <button type="submit">Save</button>
</form>

<a th:href="@{/members}">Back</a>

</body>
</html>
