<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Readable Item</title>
</head>
<body>

<h2>Edit Readable Item</h2>

<form th:action="@{/readableitems/{id}(id=${item.id})}"
      th:object="${item}"
      method="post">

    <label>ID:
        <input th:field="*{id}" readonly/>
    </label><br/>

    <label>Publication ID:
        <input th:field="*{publicationId}" required/>
    </label><br/>

    <label>Barcode:
        <input th:field="*{barcode}" required/>
    </label><br/>

    <label>Status:
        <select th:field="*{status}">
            <option th:each="s : ${statuses}"
                    th:value="${s}"
                    th:text="${s}">
            </option>
        </select>
    </label><br/>

    <button type="submit">Update</button>
</form>

<a th:href="@{/readableitems}">Back</a>

</body>
</html>
